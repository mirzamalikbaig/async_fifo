name: FIFO tests
on:
  push:
    paths:
      - '**.sv'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - '**.sv'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the simulator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Run the seven tests and the combined test
        shell: bash # Stop the job if a test fails, including before tee.
        run: |
          mkdir -p build
          python3 scripts/regress.py verilator | tee build/regression.log
          ./build/obj_dir/Vtb +TEST=all | tee build/all.log
      - name: Save the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifo-test-logs
          path: build/*.log
