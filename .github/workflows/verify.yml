name: FIFO verification
on:
  push:
    paths:
      - '**.sv'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - '**.sv'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      diagnostic: ${{ steps.simulation.outputs.diagnostic }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Run beginner FIFO tests
        id: simulation
        continue-on-error: true
        run: |
          mkdir -p build
          set +e
          python3 scripts/regress.py verilator 2>&1 | tee build/regression.log
          result=${PIPESTATUS[0]}
          diagnostic=$(sed -n '/%Error\|Assertion failed\|Data mismatch/p' build/regression.log | head -n 1)
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          ./build/obj_dir/Vtb +TEST=all 2>&1 | tee build/all.log
      - name: Keep simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifo-verification-logs
          path: build/**/*.log
      - name: Require a passing regression
        if: steps.simulation.outcome != 'success'
        run: exit 1
  diagnostic:
    needs: regression
    if: always() && needs.regression.result == 'failure'
    name: "${{ needs.regression.outputs.diagnostic || 'See FIFO verification logs' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Report regression failure
        run: exit 1
